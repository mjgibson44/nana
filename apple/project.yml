# XcodeGen spec — the source of truth for the Xcode project.
# Regenerate with `xcodegen generate` (or just run ./bootstrap.sh);
# Word.xcodeproj is generated output and stays out of git.
name: Word
options:
  bundleIdPrefix: dev.nana
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  WordCore:
    path: Packages/WordCore
  WordBoard:
    path: Packages/WordBoard
  WordNet:
    path: Packages/WordNet

schemes:
  Word:
    build:
      targets:
        Word: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WordTests
    profile:
      config: Release
    archive:
      config: Release

targets:
  Word:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: Word
      # The canonical validation dictionary, referenced (not copied) from the
      # web app's public/ so the two platforms can never drift.
      - path: ../public/dictionary.txt
        buildPhase: resources
    dependencies:
      - package: WordCore
      - package: WordBoard
      - package: WordNet
    # XcodeGen generates the entitlements plist from this block, so these keys
    # live here rather than in a hand-written file it would overwrite.
    entitlements:
      path: Word/Word.entitlements
      properties:
        # Game Center: auth, leaderboards, achievements, GKMatch (§7, §8).
        com.apple.developer.game-center: true
        # iCloud key-value storage for the cross-device progress merge (§9.1).
        # A few KB of stat blobs — well inside the 1 MB / 1,024 key budget,
        # which is why CloudKit would be over-engineering here.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # The Mac build is sandboxed; GKMatch needs the network.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Word/Info.plist
      properties:
        # The store-facing name. "Word" is unsearchable on the App Store
        # (plan §13, §16.2); the repo, targets and modules keep their names —
        # only what a player sees changes.
        CFBundleDisplayName: Time Tiles
        CFBundleName: Time Tiles
        # Point these at the build settings. XcodeGen otherwise writes literal
        # defaults ("1.0" / "1"), which silently override MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION — so every TestFlight upload would be build 1,
        # and App Store Connect rejects a build number it has already seen.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Required: an upload with no orientations at all is rejected (90474).
        # The game screen is a vertical stack — header, board, word bar, pile —
        # so a phone plays it upright. An iPad has the height for any of them,
        # and supporting all four is what iPad multitasking requires (the
        # alternative being UIRequiresFullScreen, which is worse on a device
        # people run apps side by side on).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.word-games
        # Game Mode opt-in (see docs/apple-port-plan.md §9.5).
        GCSupportsGameMode: true
        LSSupportsGameMode: true
        ITSAppUsesNonExemptEncryption: false
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        # Set explicitly rather than derived from the target name: a bundle id
        # is permanent once the app ships, so it matches the product name now
        # while that is still free to do.
        PRODUCT_BUNDLE_IDENTIFIER: dev.nana.TimeTiles
        # Generated by tools/make-icon.swift from the game's design tokens.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Read from Local.xcconfig (gitignored) rather than hardcoded: a team
        # id is per-developer, and picking one in Xcode's UI would be wiped by
        # the next `xcodegen generate`.
        DEVELOPMENT_TEAM: "$(WORD_DEVELOPMENT_TEAM)"

  # App-layer tests that need SwiftUI (the §11 board-render perf gate at max
  # zoom-out). Pure logic tests live in the packages and run in CI; this
  # bundle runs locally / on a Mac via `xcodebuild test -scheme Word`.
  WordTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: WordTests
    dependencies:
      - target: Word
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # A test bundle needs an Info.plist to be signed, and XcodeGen writes
        # none for a target with no `info:` block — without this, the whole
        # scheme fails to build before a single test runs.
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen writes one iOS-shaped TEST_HOST; the multiplatform app's
        # macOS bundle nests its binary differently.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Word.app/Contents/MacOS/Word"
